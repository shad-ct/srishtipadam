<svg width="300" height="400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="bkGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>
  <!-- Book background -->
  <rect width="100%" height="100%" fill="url(#bkGrad4)" rx="8"/>
  
  <!-- Spine Shadow/Crease -->
  <rect x="0" y="0" width="15" height="100%" fill="rgba(0,0,0,0.3)"/>
  <line x1="15" y1="0" x2="15" y2="400" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  
  <!-- Ornamental Borders -->
  <rect x="25" y="25" width="250" height="350" fill="none" stroke="#d7ccc8" stroke-width="1" opacity="0.3" rx="4"/>
  <rect x="30" y="30" width="240" height="340" fill="none" stroke="#d7ccc8" stroke-width="1.5" opacity="0.5" rx="2"/>

  <!-- Logo/Emblem -->
  <g transform="translate(135, 70)" opacity="0.8">
    <path d="M15,0 L30,15 L15,30 L0,15 Z" fill="none" stroke="#d7ccc8" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="5" fill="#d7ccc8"/>
  </g>

  <!-- Titles -->
  <text x="150" y="170" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#d7ccc8" text-anchor="middle" letter-spacing="1">MANASSINTE VAZHI</text>
  
  <line x1="80" y1="200" x2="220" y2="200" stroke="#d7ccc8" stroke-width="1.5" opacity="0.4"/>
  
  <text x="150" y="235" font-family="'Inter', sans-serif" font-size="13" font-style="italic" fill="rgba(255,255,255,0.8)" text-anchor="middle">Siddharth Menon</text>
  
  <!-- Brand text -->
  <text x="150" y="340" font-family="'Outfit', sans-serif" font-size="9" font-weight="700" fill="#d7ccc8" text-anchor="middle" letter-spacing="3" opacity="0.6">SRISHTIPADAM</text>
</svg>